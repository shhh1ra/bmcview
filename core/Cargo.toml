[package]
name = "ibmc-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Протокол KVM Huawei iBMC: фрейминг, крипто, сборка и декодирование видео. Без UI и без зависимостей от ОС."

[dependencies]
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
jpeg-decoder = { version = "0.3", default-features = false }
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1"
